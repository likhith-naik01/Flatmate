# RoomMate Application Properties
# H2 file-based database for zero-config persistence without external service dependencies
spring.datasource.url=jdbc:h2:file:./data/roommate_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL configuration alternative (can be toggled if MySQL is available):
# spring.datasource.url=jdbc:mysql://localhost:3306/roommate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=YOUR_MYSQL_USERNAME
# spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
